{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Control panel login</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Open+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" referrerpolicy="no-referrer">
  <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
  <script>
    tailwind.config = { theme: { extend: {
      colors: { primary: { 400: '#63748A', 600: '#2C3D4E', 800: '#1A2B3C', 900: '#111D29' }, secondary: { DEFAULT: '#E67E22', 600: '#C96512' } },
      fontFamily: { heading: ['Montserrat', 'sans-serif'], body: ['Open Sans', 'sans-serif'] }
    } } };
  </script>
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body class="flex min-h-screen items-center justify-center bg-primary-900 px-4 font-body">
  <div class="w-full max-w-sm">
    <div class="rounded-2xl bg-white p-8 shadow-2xl">
      <div class="flex items-center gap-2">
        <span class="flex h-10 w-10 items-center justify-center rounded-lg bg-secondary text-white"><i class="fa-solid fa-lock"></i></span>
        <div>
          <h1 class="font-heading text-lg font-extrabold text-primary-800">Control panel</h1>
          <p class="text-[11px] uppercase tracking-widest text-primary-600/70">Staff access only</p>
        </div>
      </div>

      {% if form.errors %}
        <div class="mt-6 rounded-lg border-l-4 border-red-500 bg-red-50 p-3 text-xs text-red-700">
          {% for error in form.non_field_errors %}<p>{{ error }}</p>{% endfor %}
          <p>Please check your credentials and try again.</p>
        </div>
      {% endif %}

      <form method="post" class="mt-6 space-y-4">
        {% csrf_token %}
        <div>
          <label for="{{ form.username.id_for_label }}" class="mb-1.5 block text-sm font-semibold text-primary-800">Username</label>
          <input type="text" name="username" id="{{ form.username.id_for_label }}" autocomplete="username" required
                 class="w-full rounded-lg border border-gray-300 px-3.5 py-2.5 text-sm focus:border-secondary focus:ring-2 focus:ring-secondary/30">
        </div>
        <div>
          <label for="{{ form.password.id_for_label }}" class="mb-1.5 block text-sm font-semibold text-primary-800">Password</label>
          <input type="password" name="password" id="{{ form.password.id_for_label }}" autocomplete="current-password" required
                 class="w-full rounded-lg border border-gray-300 px-3.5 py-2.5 text-sm focus:border-secondary focus:ring-2 focus:ring-secondary/30">
        </div>
        <input type="hidden" name="next" value="{{ next }}">
        <button type="submit" class="w-full rounded-lg bg-primary-800 px-6 py-3 text-sm font-bold text-white transition-colors hover:bg-primary-600">Sign in</button>
      </form>
    </div>

    <p class="mt-5 text-center text-xs text-white/40">
      Unauthorised access is prohibited · <a href="{% url 'core:landing' %}" class="hover:text-white/70">Return to website</a>
    </p>
  </div>
</body>
</html>
